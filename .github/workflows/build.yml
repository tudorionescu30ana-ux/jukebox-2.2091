name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build (android64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: nightly
          configure-args: -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      - uses: actions/upload-artifact@v4
        with:
          name: jukebox-android64
          path: build/*.geode
